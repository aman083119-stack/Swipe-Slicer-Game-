<text x="70" y="178" font-size="75" font-weight="950" letter-spacing="-3">SWIPE</text><text x="70" y="258" font-size="75" font-weight="950" letter-spacing="-3" fill="#54e7f5">SLICER</text>
<text x="76" y="309" font-size="23" fill="#c5cce8">Slice combos, not just shapes.</text><text x="76" y="353" font-size="14" font-weight="700" letter-spacing="2" fill="#9ba5cc">HTML5 CANVAS  ·  YOUTUBE PLAYABLES  ·  NO ADS</text></g></svg>